# Pipeline raíz de GitLab CI/CD
#
# MIG-01 (#134): pipeline mínimo para demostrar ejecución y bloqueo de MR.
# MIG-02 (#135): paridad con `.github/workflows/ci.yml` — lint, format, typecheck,
#                tests unitarios, contratos (OpenAPI + Kotlin), build y e2e.
# MIG-03 (#136): paridad con `.github/workflows/web-ci.yml` — calidad web,
#                Playwright (E2E, a11y, visual), seguridad y Sonar.
# MIG-04 (#137): build Android (SDK 35 + cache Gradle).
# MIG-05 (#138): seguridad transversal (Trivy, pnpm audit, Sonar opt-in).
# MIG-06 (#139): imagen web al registry y CD a staging/producción con rollback.
#
# Los jobs de backend viven en `.gitlab/ci/backend.yml`, los de web en
# `.gitlab/ci/web.yml`, los de Android en `.gitlab/ci/android.yml`, los de
# seguridad en `.gitlab/ci/security.yml` y los de despliegue en
# `.gitlab/ci/deploy.yml`.
# Decisiones de plataforma, runners y registry: docs/adr/009-gitlab-ci-cd-platform.md

stages:
  - validate
  - test
  - build
  - security
  - deploy

include:
  - local: .gitlab/ci/backend.yml
  - local: .gitlab/ci/web.yml
  - local: .gitlab/ci/android.yml

default:
  image: node:20-bookworm
  interruptible: true

variables:
  PNPM_STORE_DIR: '$CI_PROJECT_DIR/.pnpm-store'

.pnpm-base:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@12.9.1 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR" --global
    - pnpm install --frozen-lockfile
