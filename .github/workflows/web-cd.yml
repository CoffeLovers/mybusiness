name: Web CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'packages/common/**'
      - 'pnpm-lock.yaml'
      - 'apps/web/Dockerfile'
      - '.github/workflows/web-cd.yml'

concurrency:
  group: web-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mybusiness-web

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mybusiness-web:${{ needs.build.outputs.sha }}
      # `secrets` no está disponible en los `if` de los steps: se expone vía env.
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        if: env.STAGING_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy over SSH
        if: env.STAGING_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            IMAGE="${{ env.IMAGE }}"
            REGISTRY_IMAGE="ghcr.io/${{ github.repository_owner }}/mybusiness-web"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"

            if docker inspect mybusiness-web >/dev/null 2>&1; then
              docker inspect --format '{{.Config.Image}}' mybusiness-web > /tmp/mybusiness-web-previous
            else
              rm -f /tmp/mybusiness-web-previous
            fi

            docker rm -f mybusiness-web || true
            docker run -d --name mybusiness-web --restart unless-stopped \
              -p 3000:3000 -e NODE_ENV=production "$IMAGE"

            sleep 30
            if curl -fsS http://127.0.0.1:3000/healthz; then
              echo "Smoke OK"
            else
              echo "Smoke FAILED en staging"
              if [ -s /tmp/mybusiness-web-previous ]; then
                PREVIOUS="$(cat /tmp/mybusiness-web-previous)"
                docker rm -f mybusiness-web || true
                docker run -d --name mybusiness-web --restart unless-stopped \
                  -p 3000:3000 -e NODE_ENV=production "$PREVIOUS" || true
              fi
              exit 1
            fi

      - name: External smoke
        if: env.STAGING_HOST != ''
        run: |
          curl -fsS "${{ vars.STAGING_URL }}/healthz"
          curl -fsS -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}/login" | grep -q 200

      - name: Deployment skipped
        if: env.STAGING_HOST == ''
        run: |
          echo "::notice title=Web CD::Despliegue a staging omitido (falta STAGING_HOST)."

  # El environment `production` debe configurarse en GitHub con *required reviewers*
  # (Settings > Environments > production) para exigir aprobación manual antes del deploy.
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mybusiness-web:${{ needs.build.outputs.sha }}
      # `secrets` no está disponible en los `if` de los steps: se expone vía env.
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        if: env.PRODUCTION_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Deploy over SSH
        if: env.PRODUCTION_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            IMAGE="${{ env.IMAGE }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"

            if docker inspect mybusiness-web-prod >/dev/null 2>&1; then
              docker inspect --format '{{.Config.Image}}' mybusiness-web-prod > /tmp/mybusiness-web-previous
            else
              rm -f /tmp/mybusiness-web-previous
            fi

            docker rm -f mybusiness-web-prod || true
            docker run -d --name mybusiness-web-prod --restart unless-stopped \
              -p 3001:3000 -e NODE_ENV=production "$IMAGE"

            sleep 30
            if curl -fsS http://127.0.0.1:3001/healthz; then
              echo "Smoke OK"
            else
              echo "Smoke FAILED en production"
              if [ -s /tmp/mybusiness-web-previous ]; then
                PREVIOUS="$(cat /tmp/mybusiness-web-previous)"
                docker rm -f mybusiness-web-prod || true
                docker run -d --name mybusiness-web-prod --restart unless-stopped \
                  -p 3001:3000 -e NODE_ENV=production "$PREVIOUS" || true
              fi
              exit 1
            fi

      - name: External smoke
        if: env.PRODUCTION_HOST != ''
        run: |
          curl -fsS "${{ vars.PRODUCTION_URL }}/healthz"
          curl -fsS -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/login" | grep -q 200

      - name: Deployment skipped
        if: env.PRODUCTION_HOST == ''
        run: |
          echo "::notice title=Web CD::Despliegue a production omitido (falta PRODUCTION_HOST)."
