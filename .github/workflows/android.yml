name: Android CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/mobile-android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/mobile-android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile-android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test and assemble
        run: ./gradlew :core:designsystem:testDebugUnitTest :core:common:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace --console=plain
