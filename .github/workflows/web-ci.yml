name: Web CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'apps/api-gateway/**'
      - 'packages/contracts/**'
      - 'packages/common/**'
      - 'docs/openapi/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'docs/design/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'apps/api-gateway/**'
      - 'packages/contracts/**'
      - 'packages/common/**'
      - 'docs/openapi/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'docs/design/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-ci.yml'

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @mybusiness/web lint
      - name: Prettier
        run: pnpm exec prettier --check "apps/web/**/*.{ts,tsx,css,json,md}"
      - name: Design token contrast
        run: pnpm test:contrast
      - name: Typecheck
        run: pnpm --filter @mybusiness/web typecheck
      - name: Unit tests with coverage
        run: pnpm --filter @mybusiness/web test:cov
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore
      - name: Build
        run: pnpm --filter @mybusiness/web build

  contracts:
    name: Contracts & Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages and API Gateway
        run: |
          pnpm --filter @mybusiness/contracts build
          pnpm --filter @mybusiness/common build
          pnpm --filter @mybusiness/api-gateway build
      - name: Check OpenAPI and web types drift
        run: pnpm contracts:check
      - name: Check Kotlin contracts parity
        run: pnpm contracts:check:kotlin
      - name: Upload drift diff artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-drift-artifacts
          path: |
            docs/openapi/api-gateway.json
            node_modules/.cache/contracts-check/
            contracts-drift.diff
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [quality, contracts]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @mybusiness/web exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter @mybusiness/web test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-diffs
          path: |
            apps/web/test-results/**/*-diff.png
            apps/web/test-results/**/*-actual.png
            apps/web/test-results/**/*-expected.png
          retention-days: 7
          if-no-files-found: ignore

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @mybusiness/web exec playwright install --with-deps chromium
      - name: Run accessibility tests
        run: pnpm --filter @mybusiness/web exec playwright test e2e/accessibility.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-a11y-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-a11y-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Container security
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/web/Dockerfile -t mybusiness-web:${{ github.sha }} .
      - name: Trivy scan (table)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: mybusiness-web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret

      - name: Trivy scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: mybusiness-web:${{ github.sha }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln,secret
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-web-sarif
          path: trivy-web.sarif
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0
      - name: Download coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=CoffeLovers_mybusiness
            -Dsonar.organization=coffeelovers
            -Dsonar.sources=apps/web
            -Dsonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
            -Dsonar.exclusions=apps/web/.next/**,apps/web/coverage/**,apps/web/playwright-report/**,apps/web/lib/generated/**
