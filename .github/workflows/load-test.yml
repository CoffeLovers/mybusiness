name: Load Test (k6)

# Este workflow ejecuta la prueba de carga k6.
# NOTA DE QA (Issue #54):
# - La ejecución de carga real (Opción A) requiere el stack completo (gateway, microservicios, Postgres y Redis).
# - Cualquier ejecución contra el mock gateway es exclusivamente un smoke para validar el arnés k6 y no constituye evidencia de aceptación.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base del API Gateway real (ej. http://127.0.0.1:3000 o endpoint de staging)'
        type: string
        required: false
        default: 'http://127.0.0.1:3000'
      run_id:
        description: 'Identificador único de la corrida (RUN_ID)'
        type: string
        required: false
        default: ''
      smoke:
        description: 'Modo SMOKE reducido para validar conectividad y arnés (10 segundos)'
        type: boolean
        required: false
        default: false

jobs:
  load-test:
    name: Ingesta Masiva Transacciones k6 (Stack Real / Staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Ejecutar probe de idempotencia (pre-carga)
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:3000' }}
          RUN_ID: ${{ inputs.run_id }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          LOAD_CURRENCY: 'COP'
        run: |
          k6 run tests/load/idempotency-check.js

      - name: Ejecutar prueba de carga k6
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:3000' }}
          RUN_ID: ${{ inputs.run_id }}
          SMOKE: ${{ inputs.smoke }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          LOAD_CURRENCY: 'COP'
        run: |
          k6 run tests/load/ingest-50k.js

      - name: Subir artefactos de resumen k6 y verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-artifacts
          path: |
            tests/load/k6-summary.json
            tests/load/verification-54.json
          retention-days: 14
