# OpenTelemetry Collector — distribución otel/opentelemetry-collector-contrib (SF3-07)
# Pipeline de trazas: otlp (grpc 4317 / http 4318) → batch → Jaeger (backend local).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
