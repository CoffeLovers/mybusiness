services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mybusiness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mybusiness_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      FINANCE_DB_USER: ${FINANCE_DB_USER:-finance_user}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?FINANCE_DB_PASSWORD is required}
      AGENT_DB_USER: ${AGENT_DB_USER:-agent_user}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}
      AUDIT_DB_USER: ${AUDIT_DB_USER:-audit_user}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD is required}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-microservices-dbs.sh:/docker-entrypoint-initdb.d/init-microservices-dbs.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mybusiness_admin} -d ${POSTGRES_DB:-auth_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mybusiness_redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - 'yes'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # NOTE: los valores por defecto de S3_ACCESS_KEY/S3_SECRET_KEY (minioadmin) son
  # SOLO para desarrollo local. En cualquier entorno compartido/staging/producción
  # deben definirse explícitamente S3_ACCESS_KEY y S3_SECRET_KEY con credenciales
  # seguras; nunca usar los defaults fuera de un entorno local aislado.
  minio:
    image: minio/minio:latest
    container_name: mybusiness_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: mybusiness_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-mybusiness-documents}
    restart: 'no'

  # ------------------------------------------------------------------------------
  # Observabilidad de trazas (OpenTelemetry, SF3-07)
  # ------------------------------------------------------------------------------
  # Jaeger all-in-one es SOLO el backend interno de desarrollo; no expone 4317/4318
  # al host: las señal entra únicamente por el collector (single point of ingress).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: mybusiness_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '127.0.0.1:${JAEGER_UI_PORT:-16686}:16686'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: mybusiness_otel_collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318'
    depends_on:
      - jaeger

volumes:
  postgres_data:
  redis_data:
  minio_data:
