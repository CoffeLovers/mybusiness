services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mybusiness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mybusiness_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_in_production_postgres_admin_pass}
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-microservices-dbs.sql:/docker-entrypoint-initdb.d/init-microservices-dbs.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mybusiness_admin} -d ${POSTGRES_DB:-auth_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mybusiness_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_in_production_redis_secret} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_in_production_redis_secret}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-change_in_production_redis_secret}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
