services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mybusiness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mybusiness_user
      POSTGRES_PASSWORD: mybusiness_pass
      POSTGRES_DB: auth_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mybusiness_user -d auth_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mybusiness_redis
    restart: unless-stopped
    command: redis-server --requirepass mybusiness_redis_secret --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'mybusiness_redis_secret', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
